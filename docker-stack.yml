version: "3.8"

services:
  web:
    image: hello-web:latest
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hellodb
      DB_USER: hello
      DB_PASSWORD: hello
      FLASK_DEBUG: "0"
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first 
      restart_policy:
        condition: on-failure
    networks:
      - frontend
      - backend
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hellodb
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  pgdata:

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay